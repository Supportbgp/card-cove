name: Deploy staging

# Pushing the `staging` branch (e.g. `git push origin my-branch:staging
# --force` to test a PR) redeploys the site so /card-cove/staging/ shows it.
# The deploy itself runs on main (deploy.yml builds production from main
# and staging from this branch), because the github-pages environment only
# accepts deploys from main. A workflow_dispatch started with the
# GITHUB_TOKEN is one of the few events allowed to start another run.

on:
  push:
    branches: [staging]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
