name: Deploy to GitHub Pages

# One Pages site holds both environments:
#   /card-cove/          production, built from main
#   /card-cove/staging/  staging, built from the `staging` branch (if it
#                        exists) against the staging Supabase project
# Pages replaces the whole site on every deploy, so every run builds both.
# Runs on a push to main, or is started on main by staging-deploy.yml when
# the staging branch is pushed (the github-pages environment only accepts
# deploys from main).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: prod
      - name: Look for a staging branch
        id: stg
        run: |
          if git -C prod ls-remote --exit-code --heads origin staging > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.stg.outputs.exists == 'true'
        with:
          ref: staging
          path: stg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prod/package-lock.json
      - name: Build production
        working-directory: prod
        run: |
          npm ci
          npm run build
      # A broken staging branch must never block a production deploy: if this
      # fails, the site goes out without /staging/ and the run shows a warning.
      - name: Build staging
        id: stgbuild
        if: steps.stg.outputs.exists == 'true'
        continue-on-error: true
        working-directory: stg
        run: |
          npm ci
          npm run build:staging
      - name: Put the site together
        run: |
          mkdir site
          cp -r prod/dist/. site/
          if [ "${{ steps.stgbuild.outcome }}" = "success" ]; then
            mkdir site/staging
            cp -r stg/dist/. site/staging/
          elif [ "${{ steps.stg.outputs.exists }}" = "true" ]; then
            echo "::warning::The staging branch failed to build, so /staging/ was left out of this deploy."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
